<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: 2732px; height: 2732px;
    background: #0d1f3c;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
  }
  .icon {
    width: 320px; height: 320px;
    border-radius: 72px;
    overflow: hidden;
    margin-bottom: 60px;
  }
  .icon img { width: 100%; height: 100%; object-fit: cover; }
  .app-name {
    color: white;
    font-size: 80px;
    font-weight: 600;
    letter-spacing: 4px;
    margin-bottom: 16px;
  }
  .app-sub {
    color: #f5a623;
    font-size: 36px;
    letter-spacing: 10px;
    font-weight: 400;
  }
  .bar {
    width: 120px; height: 6px;
    background: #f5a623;
    border-radius: 3px;
    margin-top: 60px;
    opacity: 0.6;
  }
</style>
</head>
<body>
  <div class="icon">
    <img src="assets/icon.png" alt="icon"/>
  </div>
  <div class="app-name">Descent</div>
  <div class="app-sub">PLANNING</div>
  <div class="bar"></div>
</body>
</html>
